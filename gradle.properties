# Gradle Specifications
org.gradle.jvmargs=-Xms256M -Xmx2G
org.gradle.daemon=false

# General Specifications
mc_version=1.12.2
mod_version=1.4.5
# DO NOT RAISE THIS. 14.23.5.2847 is the last 1.12.2 Forge build that publishes a
# `-userdev.jar` artifact. Builds 2848+ publish only `-userdev3.jar`, which is the
# ForgeGradle 3 format that the ForgeGradle 2.3 fork used here cannot consume - the
# download 404s and the build fails. This is a toolchain ceiling, not a bug.
# It does not limit what players can run: 1.12.2 Forge is binary-compatible across
# these builds, so a mod compiled against 2847 runs fine on 2860.
forge_version=14.23.5.2847
mod_group=com.exiledradio
# Permanent from the first release: it is the config file name, the resource domain and the network
# channel of every world and pack that uses the library.
mod_id=backportcore
mod_name=Backport Core
mod_archives_name=BackportCore
mod_author=ExiledRadio
mod_description=Shared code and assets for the update backports: 1.14's Texture Update for vanilla's blocks, items and mobs (with a switch back to 1.12.2's look), 1.13's waterlogging for the family's blocks (through Fluidlogged API, when installed), today's structure files and structure placement on vanilla and modded terrain, 1.14's player poses (swimming and crawling, with their hitbox, camera and animation), a trade registry, smithing upgrades, each update's look and feel (title panorama, world-loading screen, options screens, splashes, music) following the newest installed backport, and moving worlds over from other mods' copies of the same blocks. Its one block is today's jigsaw block, for operators.
mod_credits=By ExiledRadio. Not affiliated with Mojang.
mod_url=https://github.com/ExiledRadio/BackportCore

# Dev-only: set `deployDir` in ~/.gradle/gradle.properties to auto-copy the
# built jar into a test instance's mods folder. Deliberately not set here so
# the build stays machine-independent.
