buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	// Single-sourced from gradle.properties - see the ceiling note on forge_version there.
	version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
	runDir = "eclipse"

	replace '@VERSION@', project.version
	replaceIn 'BackportCore.java'
}

processResources {
	// Gradle does not treat `expand` values as task inputs, so without declaring them here the task
	// stays UP-TO-DATE across a version bump and the jar ships an mcmod.info claiming the old version.
	inputs.property 'version', project.version
	inputs.property 'mod_id', mod_id
	inputs.property 'mod_name', mod_name
	inputs.property 'mod_author', mod_author
	inputs.property 'mod_description', mod_description
	inputs.property 'mod_credits', mod_credits
	inputs.property 'mod_url', mod_url
	inputs.property 'mc_version', mc_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
		'mod_id': mod_id,
		'mod_name': mod_name,
		'mod_author': mod_author,
		'mod_description': mod_description,
		'mod_credits': mod_credits,
		'mod_url': mod_url,
		'mc_version': mc_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

repositories {
	// CurseMaven serves CurseForge files by project and file id, so the version is pinned exactly.
	maven { url 'https://cursemaven.com' }
}

dependencies {
	// Fluidlogged API 3.3.3 (CurseForge 485654, file 8445863): the one required dependency. It gives
	// every family block 1.13's waterlogging (see waterlog/). deobfCompile maps it to dev names, and
	// FG2's GradleStart finds its coremod on the classpath, so runServer loads it. Its license allows
	// depending on it, not bundling it: never shade or jar-in-jar it.
	deobfCompile 'curse.maven:fluidlogged-api-485654:8445863'
}

// Every other mod is reached by name and reflection, behind a Loader.isModLoaded check. No Mixin.

// The library's own coremod (package asm; every patch in docs/PATCHES.md). The release jar and the dev
// jar name it in their manifests: the dev jar is what puts the library on a backport's runServer and
// runClient classpath, where FG2's GradleStart finds coremods by their manifest. This repository's own
// run tasks name it with fml.coreMods.load.
def coremod = 'com.exiledradio.backportcore.asm.BackportCorePlugin'
def coremodManifest = {
	attributes 'FMLCorePlugin': coremod,
			'FMLCorePluginContainsFMLMod': 'true'
}
jar {
	manifest coremodManifest
}

// The run tasks always run (a dev server is how the library is tested). Never cleanRunServer to force
// one: it deletes eclipse/.
[runServer, runClient].each { task ->
	// -PwithCoremods=<class>[,<class>...]: the coremods of the -PwithMods jars, when their manifests do not name them.
	task.systemProperty 'fml.coreMods.load', project.hasProperty('withCoremods') ? "${coremod},${project.property('withCoremods')}" : coremod
	task.outputs.upToDateWhen { false }
	// -PselftestOnly=deepwater,patches: only those self-test groups (SelfTestRunner).
	if (project.hasProperty('selftestOnly')) {
		task.systemProperty 'backportcore.selftest.only', project.property('selftestOnly')
	}
}

// -PwithMods=<jar>[;<jar>...]: other mods' dev jars on the run classpath, for a self-test in their worlds (Caves &
// Cliffs Backport's extended height for DeepWaterTests). GradleStart finds a coremod in such a jar by its manifest.
if (project.hasProperty('withMods')) {
	dependencies {
		runtime files(project.property('withMods').toString().split(';'))
	}
}

// Headless self-tests: `gradlew runServer -Pselftest` compiles src/selftest in (FG2's runServer runs
// from the jar, so the tests have to be in it). A normal build never contains them.
if (project.hasProperty('selftest')) {
	sourceSets.main.java.srcDir 'src/selftest/java'
	sourceSets.main.resources.srcDir 'src/selftest/resources'

	// The deep water check on its own, for another mod's dev server (its eclipse/mods): see
	// selftest/deepwater/DeepWater. `gradlew deepWaterJar -Pselftest`.
	task deepWaterJar(type: Jar) {
		classifier = 'deepwater'
		from(sourceSets.main.output) {
			include 'com/exiledradio/backportcore/selftest/deepwater/**'
		}
	}
} else {
	// Gradle's copy into build/resources keeps files a selftest run left there, so the jars leave
	// them out by name as well.
	tasks.matching { it.name in ['jar', 'devJar'] }.all {
		exclude 'assets/backportcore_selftest/**', 'com/exiledradio/backportcore/selftest/**',
				'com/exiledradio/backportcore/waterlog/MigrationAccess*'
	}
}

// The MCP-named jar the backports compile against (plain `compile`, never deobfCompile from a
// flatDir: FG2 would then compile against the SRG-named jar). It is also what puts this library on
// a dependent's runClient/runServer classpath, where FML finds it as a mod.
task devJar(type: Jar) {
	classifier = 'dev'
	from sourceSets.main.output
	manifest coremodManifest
}

task sourcesJar(type: Jar) {
	classifier = 'sources'
	from sourceSets.main.allSource
}

artifacts {
	archives devJar
	archives sourcesJar
}

// After any change here: `gradlew build copyToDependents`. Each backport that lists this library
// compiles against the dev jar in its deps/ folder. Only workspaces that already have a deps/ folder
// get one, so this never creates folders in a repository that does not use the library.
def dependents = ['RLCraftVillagerTrading', 'RLCraftVillagerTrading-core-extraction', 'UpdateAquaticBackport', 'NetherUpdateBackport']

task copyToDependents(dependsOn: 'devJar') {
	doLast {
		dependents.each { name ->
			def depsDir = file("../${name}/deps")
			if (depsDir.isDirectory()) {
				fileTree(depsDir).matching { include "${archivesBaseName}-*.jar" }.each { it.delete() }
				copy {
					from devJar.archivePath
					into depsDir
				}
				logger.lifecycle("Copied ${devJar.archiveName} to ${depsDir}")
			}
		}
	}
}

// Dev convenience: copies the built jar straight into a local test instance. Opt-in and
// machine-local - set `coreDeployDir` in ~/.gradle/gradle.properties, not here. Deliberately not the
// workspace-wide `deployDir`, which points at another mod's instance.
def deployDir = project.findProperty('coreDeployDir')

task deployToInstance(type: Copy) {
	onlyIf { deployDir && file(deployDir).isDirectory() }

	// A version bump would otherwise leave the old jar beside the new one, and FML refuses to start
	// with two mods declaring the same mod id.
	doFirst {
		if (deployDir && file(deployDir).isDirectory()) {
			file(deployDir).listFiles()?.each { f ->
				if (f.name ==~ /^${archivesBaseName}-[0-9].*\.jar$/ && !f.name.endsWith('-dev.jar')
						&& !f.name.endsWith('-sources.jar')) {
					logger.lifecycle("Removing previous build: ${f.name}")
					f.delete()
				}
			}
		}
	}

	from jar.archivePath
	into deployDir ?: "$buildDir/deploy"
	rename { "${archivesBaseName}-${project.version}.jar" }
}

deployToInstance.dependsOn reobfJar

// reobfJar rewrites the jar in place, which Gradle cannot see, so it can decide there is nothing to
// do and leave a jar with development names in it. That jar works in runClient and crashes a real
// instance with NoSuchMethodError on the first Minecraft method it calls. Always run it - and after
// any runClient/runServer, build again before copying the jar anywhere.
reobfJar.outputs.upToDateWhen { false }
build.finalizedBy deployToInstance
